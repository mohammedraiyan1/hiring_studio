name: NEX prototype CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/nex-talent-prototype, feat/nex-recruitment-pipeline]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI_Hiring_Assistant-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            AI_Hiring_Assistant-main/package-lock.json
            AI_Hiring_Assistant-main/server/package-lock.json
            AI_Hiring_Assistant-main/client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run build --prefix client
      - name: Check server JavaScript syntax
        run: find server/src -name '*.js' -print0 | xargs -0 -n1 node --check
